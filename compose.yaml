services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: idleforge
      POSTGRES_PASSWORD: idleforge_local
      POSTGRES_DB: idleforge
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idleforge -d idleforge"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6384:6379"
    volumes:
      - redis_8_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://idleforge:idleforge_local@postgres:5432/idleforge
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "dist/server.js"]

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://idleforge:idleforge_local@postgres:5432/idleforge
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/worker.js"]

  scheduler:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://idleforge:idleforge_local@postgres:5432/idleforge
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/scheduler.js"]

volumes:
  postgres_18_data:
  redis_8_data:
