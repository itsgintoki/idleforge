services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: idleforge
      POSTGRES_PASSWORD: idleforge_local
      POSTGRES_DB: idleforge
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idleforge -d idleforge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
