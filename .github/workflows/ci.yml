name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  integration-ready:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: idleforge
          POSTGRES_PASSWORD: idleforge_local
          POSTGRES_DB: idleforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idleforge -d idleforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: docker build -t idleforge:ci .
      - name: Placeholder for revision-phase integration tests
        run: |
          echo "No retained test suite yet. Wire 'npm test' here during revision phase."
          echo "Services above prove postgres/redis boot for that phase."
