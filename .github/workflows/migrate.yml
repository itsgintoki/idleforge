name: migrate

# Manual until production secrets and the Railway deployment are configured.
# When deploys are enabled, add back:
#   workflow_run:
#     workflows: ["ci"]
#     types: [completed]
#     branches: [master]
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run db:migrate
